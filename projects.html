<!DOCTYPE html>
<html>
<head>
<title>Projects</title>
<style>
    body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:20px;
}

.projects{
    display:flex;
    gap:20px;
    justify-content:center;
    margin:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    width:250px;
    box-shadow:0px 2px 8px gray;
}
nav{
    text-align:center;
    margin-top:20px;
}

nav a{
    margin:10px;
    text-decoration:none;
    font-weight:bold;
}
.card:hover{
    transform: scale(1.05);
    transition: 0.3s
}
@media (max-width: 768px){
    .projects{
        flex-direction: column;
        align-items: center;
    }
}
.dark{
background:black;
color:white;
}
.dark .card{
    background:#333;
    color:white;
    box-shadow: 0px 2px 10px #666;
}
.dark a{
    color:#4da6ff;
}
</style>
</head>
<body>
<header>
    <button onclick="toggleMode()">Dark Mode</button>
    <h1>My Projects</h1>
</header>

<div class="projects">

    <div class="card">
        <h2>Snake Game</h2>
        <p>Developed a Snake Game using Python in Google Colab.</p>
    </div>

    <div class="card">
        <h2>Leaderboard System</h2>
        <p>Developed a leaderboard project to display and rank users based on scores.</p>
    </div>

</div>

<br>
<nav>
 <a href="index.html">Home</a>
 <a href="about.html">About</a>
 <a href="contact.html">Contact</a>
</nav>
<script>
    function toggleMode(){
        document.body.classList.toggle("dark");
    }
</script>
</body>
</html>
