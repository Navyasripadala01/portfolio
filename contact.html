<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:30px;
}

section{
    background:white;
    width:50%;
    margin:30px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 2px 8px gray;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#0056b3;
}

nav{
    text-align:center;
    margin-top:20px;
}

nav a{
    margin:10px;
    text-decoration:none;
    font-weight:bold;
}
form{
    padding:10px;
}
button{
    display: block;
    margin:15px auto 0;
}
button{
    transition:0.3s;
}
button:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>
<header>
    <h1>Contact Me</h1>
</header>

<section>
    <form>
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Message:</label>
        <textarea rows="5" placeholder="Enter your message"></textarea>

        <button type="button"onclick="validateForm()">Send</button>
</section>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
</nav>
<script>
function validateForm(){

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;

    if(name === "" || email === ""){
        alert("Please fill all required fields");
    }
    else{
    alert("Form submitted successfully!");

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
}

}
</script>
</body>
</html>
